
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRISMA - Acesso dos Responsáveis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='pais.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="logo">
            <img src="{{ url_for('static', filename='image-removebg-preview.png') }}"
                 alt="Logo CRISMA">
        </div>

        <main>
            <h1>Área dos Responsáveis</h1>
            <p>Acompanhe a frequência e o desempenho do seu catequizando.</p>
        </main>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_pais') }}">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div style="margin-top: 25px;">
            <a href="{{ url_for('login') }}">
                ← Voltar para o acesso dos catequistas
            </a>
        </div>

    </div>

</body>
</html>
